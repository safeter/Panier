name: IPC officiel du Québec

on:
  schedule:
    - cron: '17 14 * * *' # chaque jour ; ne commite que s'il y a un nouveau mois
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update-ipc.mjs', '.github/workflows/ipc.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-ipc.mjs
      - name: Commit si la série a changé
        run: |
          if [[ -n "$(git status --porcelain data/ipc-quebec.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ipc-quebec.json
            git commit -m "data: IPC officiel du Québec mis à jour"
            git push
          fi
